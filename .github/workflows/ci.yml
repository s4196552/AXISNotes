name: CI

on:
  push:
    branches: [main, "agent/**"]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  e2e-linux:
    # Real app + real files via tauri-driver (WebKitWebDriver). Windows E2E runs locally
    # with msedgedriver; see docs/DECISIONS.md.
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System deps (Tauri, WebKitWebDriver, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb x11-utils
      - run: cargo install tauri-driver --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e:build
      - name: Record native runner versions
        run: |
          {
            cat /etc/os-release
            node --version
            pnpm --version
            rustc --version
            cargo install --list
            dpkg-query -W libwebkit2gtk-4.1-0 webkit2gtk-driver xvfb
            WebKitWebDriver --version || WebKitWebDriver --help
            xvfb-run sh -c 'xdpyinfo | head -25'
          } > "$RUNNER_TEMP/axis-e2e-versions.txt" 2>&1
          cat "$RUNNER_TEMP/axis-e2e-versions.txt"
      - run: xvfb-run pnpm e2e
        env:
          AXIS_E2E_ARTIFACTS: ${{ runner.temp }}/axis-e2e-artifacts
      - name: Upload bounded fixture-only native diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/axis-e2e-artifacts
            ${{ runner.temp }}/axis-e2e-versions.txt
          retention-days: 3
          if-no-files-found: warn
