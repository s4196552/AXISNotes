<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Soft Tip Falloff + Subtle Organic Edge Feathering -->
    <radialGradient id="cusp-fade" cx="50%" cy="58%" r="44%" fx="50%" fy="58%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="88%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Warm-to-Cool Gradient from the 3-Cusp Star Reference -->
    <linearGradient id="star-tint" x1="25%" y1="20%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#d6c7b2" stop-opacity="0.26" />
      <stop offset="55%" stop-color="#b5ada2" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#94a0b8" stop-opacity="0.28" />
    </linearGradient>

    <filter id="soft-feather" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
    </filter>

    <!-- 3-Cusp Deltoid Star Mask Centered in 1920x1080 -->
    <mask id="tricusp-mask">
      <rect width="1920" height="1080" fill="#000" />
      <path d="M 960,110
               Q 960,620 1410,880
               Q 960,620 510,880
               Q 960,620 960,110 Z" fill="url(#cusp-fade)" filter="url(#soft-feather)" />
    </mask>

    <style>
      .matrix-text {
        font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
        font-size: 12.5px;
        fill: url(#star-tint);
        letter-spacing: 0.6px;
        user-select: none;
      }
    </style>
  </defs>

  <!-- Dark Background -->
  <rect width="1920" height="1080" fill="#111110" />

