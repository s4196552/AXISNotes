[package]
name = "axis"
version = "0.1.0"
description = "AXIS - local-first personal knowledge base"
authors = ["AXIS contributors"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "axis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.6", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.3"
notify = "8.2.0"
notify-debouncer-full = "0.6.0"
trash = "5.2.3"
thiserror = "2.0.21"
dunce = "1.0.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
yaml-rust2 = "0.13"
# AI providers (Phase 4): HTTPS client with rustls on the ring provider (no CMake/NASM),
# and OS keychain storage for API keys.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "http2", "charset", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
keyring = { version = "3.6.3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
tiny_http = "0.12"
base64 = "0.22"
ring = "0.17"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt"] }
