[package]
name = "axis"
version = "0.1.0"
description = "AXIS - local-first personal knowledge base"
authors = ["AXIS contributors"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "axis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.6", features = [] }
tauri-plugin-dialog = "2.7.3"
notify = "8.2.0"
notify-debouncer-full = "0.6.0"
trash = "5.2.3"
thiserror = "2.0.21"
dunce = "1.0.5"

[dev-dependencies]
tempfile = "3.27.0"
