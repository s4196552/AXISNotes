<div id="app-shell">
  <div id="main">
    <div class="workspace">
      <header class="page-header">
        <div class="page-intro">
          <h2 id="page-title">Library</h2>
          <p id="page-subtitle" hidden></p>
        </div>
        <nav class="hub-navigation" aria-label="Hub">
          <button id="nav-home" class="tab" type="button">Library</button>
          <button id="plugins-button" class="tab" type="button">Packs</button>
        </nav>
      </header>

      <div id="view-controls">
        <label class="search-field" for="search">
          <span class="glyph-search" aria-hidden="true"></span>
          <span class="sr-only">Search shortcuts and groups</span>
          <input
            id="search"
            type="search"
            placeholder="Search apps, files and sites"
            autocomplete="off"
            spellcheck="false"
          />
        </label>
        <div class="page-actions">
          <label class="sort-field" for="sort" title="Sort">
            <span class="sort-label sr-only">Sort by</span>
            <select id="sort">
              <option value="manual">My order</option>
              <option value="name">Name</option>
              <option value="type">Type</option>
            </select>
            <span class="glyph-chevron" aria-hidden="true"></span>
          </label>
          <button id="add-group" class="button" type="button" title="New group">
            <span class="glyph-folder" aria-hidden="true"></span>
            <span class="action-text">Group</span>
          </button>
          <button id="add-shortcut" class="button primary" type="button" title="Add shortcut">
            <span class="glyph-plus" aria-hidden="true"></span>
            <span class="action-text">Add</span>
          </button>
        </div>
      </div>

      <div id="content" aria-busy="true">
        <p class="loading-state">Loading your shortcuts…</p>
      </div>
    </div>
  </div>
</div>

<dialog id="dialog" aria-labelledby="dialog-title">
  <div class="dialog-panel">
    <header class="dialog-header">
      <h2 id="dialog-title">AXIS Hub</h2>
      <button
        id="dialog-close"
        class="button icon-button close-button"
        type="button"
        aria-label="Close dialog"
      >
        ×
      </button>
    </header>
    <div id="dialog-body"></div>
  </div>
</dialog>
<div id="notice" role="status" aria-live="polite"></div>
